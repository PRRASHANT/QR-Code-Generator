<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <form id="qrForm">
            <label for="qrText">Enter your text or URL</label>
            <input type="text" placeholder="Enter your text or URL" id="qrText" aria-describedby="qrStatus">

            <div id="imgBox">
                <img id="qrImage" alt="Generated QR code" />
            </div>

            <p id="qrStatus" role="status" aria-live="polite"></p>
            <button type="submit">Generate QR code</button>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
